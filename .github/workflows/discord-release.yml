name: Discord release announcements

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to preview or announce
        required: true
        type: string
      send:
        description: Send to Discord (leave unchecked for a preview)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: discord-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  announce:
    if: github.repository == 'Yeastmans/Tape-To-Tape-custom-Campaign-Framework-BepinEX-Mod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out announcement code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - name: Check formatter and delivery handling
        run: python3 -m unittest discover -s .github/discord-release -p 'test_*.py'
      - name: Preview or announce release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SEND_TO_DISCORD: ${{ github.event_name == 'release' || inputs.send }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: python3 .github/discord-release/announce.py
